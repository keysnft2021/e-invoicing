# --- Public-facing nginx: serves the React SPA and reverse-proxies /api ---
server {
    listen 80 default_server;
    server_name _;

    # Uploads / PDFs / bulk CSV can be large-ish
    client_max_body_size 25M;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: everything not a real file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API — must be reachable from the browser under the SAME origin
    # so the SPA can call `${REACT_APP_BACKEND_URL}/api/...` with cookies + CORS.
    location /api/ {
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-poll safe (signing session polling, LHDN latency, bulk uploads)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 15s;

        # Streaming responses (PDF, bulk downloads)
        proxy_buffering off;
    }

    # Cache-bust hashed static bundles
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
