# --- Public-facing nginx: serves the React SPA and reverse-proxies /api ---

# Rate-limit brute-forcing of /api/auth/*
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Uploads / PDFs / bulk CSV can be large-ish
    client_max_body_size 25M;
    client_body_timeout 60s;
    client_header_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;
    keepalive_requests 1000;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    # Security headers
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA fallback (never cache the shell)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-bust hashed static bundles (JS / CSS / fonts / images)
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Auth endpoints — burst tolerated but rate-limited
    location /api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Everything else under /api
    location /api/ {
        limit_req zone=api_limit burst=120 nodelay;
        proxy_pass         http://backend:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-poll safe (signing session polling, LHDN latency, bulk uploads)
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
        proxy_connect_timeout 15s;

        # Streaming responses (PDF, bulk downloads)
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
